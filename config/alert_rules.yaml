alerts:
  - name: high_p95_latency
    severity: warning
    condition: latency p95 > 3000 ms for 5 minutes
    type: symptom-based
    owner: observability
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error rate > 2% for 5 minutes
    type: symptom-based
    owner: api
    runbook: docs/alerts.md#alert-2
  - name: low_quality_score
    severity: warning
    condition: mean quality score < 0.75 for 10 minutes
    type: symptom-based
    owner: ai-quality
    runbook: docs/alerts.md#alert-3
