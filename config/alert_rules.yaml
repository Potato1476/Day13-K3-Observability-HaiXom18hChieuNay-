alerts:
  - name: HighLatencyAlert
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: Nguyen Tuan Anh
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateAlert
    severity: critical
    condition: error_rate_pct > 2 for 3m
    type: symptom-based
    owner: Nguyen Tuan Anh
    runbook: docs/alerts.md#alert-2
  - name: LowQualityAlert
    severity: warning
    condition: quality_score_avg < 0.75 for 10m
    type: symptom-based
    owner: Nguyen Tuan Anh
    runbook: docs/alerts.md#alert-3
