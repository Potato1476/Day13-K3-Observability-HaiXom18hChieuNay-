# Alert rules dạng Prometheus. Cả thư mục config/ được mount vào Prometheus tại
# /etc/prometheus/lab/, nên file này nằm ở /etc/prometheus/lab/alert_rules.yaml
# (xem config/prometheus.yml và docker-compose.yml).
#
# `expr: vector(0) > 1` là placeholder hợp lệ về cú pháp nên Prometheus vẫn khởi
# động được, nhưng luôn trả về vector rỗng nên alert không bao giờ fire. Thay
# bằng PromQL thật dựa trên metric trong app/metrics.py và threshold trong
# config/slo.yaml.
#
# Prometheus fire alert cho MỌI sample mà expr trả về, không so sánh với 0. Vì
# vậy expr phải là một phép so sánh lọc bớt, ví dụ `... > 3`, chứ không phải một
# biểu thức luôn có kết quả.
#
# Kiểm tra sau khi sửa:
#   python scripts/validate_dashboard.py --alerts
#   docker compose exec prometheus promtool check rules /etc/prometheus/lab/alert_rules.yaml
#   docker compose restart prometheus

