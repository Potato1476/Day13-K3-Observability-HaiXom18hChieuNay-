service: day13-observability-lab
window: 28d
datasource: prometheus
slis:
  latency_p95_seconds:
    objective: 3
    target: 99.5
    promql: histogram_quantile(0.95, sum by (le) (rate(ai_request_latency_seconds_bucket[5m])))
    note: Replace with your group's target
  error_rate_pct:
    objective: 2
    target: 99.0
    promql: sum(rate(ai_requests_total{status="error"}[5m])) / sum(rate(ai_requests_total[5m])) * 100
  hourly_cost_usd:
    objective: 2.5
    target: 100.0
    promql: sum(increase(ai_cost_usd_total[1h]))
  quality_score_avg:
    objective: 0.75
    target: 95.0
    promql: sum(rate(ai_quality_score_sum[5m])) / sum(rate(ai_quality_score_count[5m]))
