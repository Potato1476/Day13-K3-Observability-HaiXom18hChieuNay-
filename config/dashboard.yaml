dashboard:
  schema_version: 2
  title: Day 13 AI Observability
  datasource: prometheus
  time_range_minutes: 60
  refresh_seconds: 30
  panels:
    - id: latency
      title: Latency percentiles
      source: prometheus
      metrics: [ai_request_latency_seconds_bucket]
      aggregations: [p50, p95, p99]
      queries:
        p50: histogram_quantile(0.50, sum by (le) (rate(ai_request_latency_seconds_bucket[5m])))
        p95: histogram_quantile(0.95, sum by (le) (rate(ai_request_latency_seconds_bucket[5m])))
        p99: histogram_quantile(0.99, sum by (le) (rate(ai_request_latency_seconds_bucket[5m])))
      unit: seconds
      threshold:
        aggregation: p95
        operator: lte
        value: 3

    - id: traffic
      title: Request traffic
      source: prometheus
      metrics: [ai_requests_total]
      aggregations: [rate_per_minute, count_by_feature]
      queries:
        rate_per_minute: sum(rate(ai_requests_total[1m])) * 60
        count_by_feature: sum by (feature) (increase(ai_requests_total[5m]))
      unit: requests_per_minute
      threshold:
        aggregation: rate_per_minute
        operator: gte
        value: 1

    - id: errors
      title: Error rate and breakdown
      source: prometheus
      metrics: [ai_requests_total, ai_errors_total]
      aggregations: [error_rate_pct, count_by_error_type]
      queries:
        error_rate_pct: sum(rate(ai_requests_total{status="error"}[5m])) / sum(rate(ai_requests_total[5m])) * 100
        count_by_error_type: sum by (error_type) (increase(ai_errors_total[5m]))
      unit: percent
      threshold:
        aggregation: error_rate_pct
        operator: lte
        value: 2

    - id: cost
      title: Cost over time
      source: prometheus
      metrics: [ai_cost_usd_total]
      aggregations: [usd_per_minute, total_usd]
      queries:
        usd_per_minute: sum(rate(ai_cost_usd_total[1m])) * 60
        total_usd: sum(increase(ai_cost_usd_total[1h]))
      unit: usd
      threshold:
        aggregation: total_usd
        operator: lte
        value: 2.5

    - id: tokens
      title: Input and output tokens
      source: prometheus
      metrics: [ai_tokens_total]
      aggregations: [tokens_per_minute_by_direction, total_tokens]
      queries:
        tokens_per_minute_by_direction: sum by (direction) (rate(ai_tokens_total[1m])) * 60
        total_tokens: sum(increase(ai_tokens_total[1h]))
      unit: tokens
      threshold:
        aggregation: total_tokens
        operator: lte
        value: 50000

    - id: quality
      title: Quality proxy
      source: prometheus
      metrics: [ai_quality_score_sum, ai_quality_score_count]
      aggregations: [mean]
      queries:
        mean: sum(rate(ai_quality_score_sum[5m])) / sum(rate(ai_quality_score_count[5m]))
      unit: score_0_to_1
      threshold:
        aggregation: mean
        operator: gte
        value: 0.75
