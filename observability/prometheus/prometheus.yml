global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: day13-ai-api
    metrics_path: /prometheus
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: day13-observability-lab
          env: dev
